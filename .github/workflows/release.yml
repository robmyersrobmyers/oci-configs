name: Release

# Trigger on version tags pushed to the repository (e.g. v1.2.3 or v1.2.3-rc.1).
on:
  push:
    tags:
      - "v*"

# Default all jobs to read-only. Only the publish job gets write access.
# Explicitly deny id-token (OIDC) since this workflow does not use it.
permissions:
  contents: read
  id-token: none

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  # Single runner builds all targets. Cross-compilation works without CGO since
  # OPA no longer requires wasmtime-go.
  #
  # Action pins: to update a pin, find the SHA for a tag with:
  #   gh api /repos/OWNER/REPO/git/ref/tags/TAG --jq '.object.sha'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for TARGET in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w" -o oci-configs ./cmd/oci-configs
            tar czf "oci-configs_${VERSION}_${GOOS}_${GOARCH}.tar.gz" oci-configs README.md
          done

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: dist
          path: "*.tar.gz"
          if-no-files-found: error

  # ── Publish ────────────────────────────────────────────────────────────────
  # Generates a SHA-256 checksum file and creates the GitHub release.

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # needed for --generate-notes changelog

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Checksum and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          # Detect pre-release from tag (e.g. v1.0.0-rc.1 or v1.0.0-beta.1)
          PRERELEASE_FLAG=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            *.tar.gz checksums.txt
