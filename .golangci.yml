version: "2"

linters:
  default: none
  enable:
    - bodyclose    # verifies HTTP response bodies are closed
    - errcheck     # checks error return values are handled
    - exhaustive   # checks exhaustiveness of enum switches
    - govet        # reports suspicious constructs
    - ineffassign  # detects ineffectual assignments
    - misspell     # finds commonly misspelled words
    - nolintlint   # ensures nolint directives are specific and necessary
    - prealloc     # suggests slice preallocation where possible
    - revive       # general Go style and correctness
    - staticcheck  # comprehensive static analysis (includes gosimple, stylecheck)
    - unconvert    # removes unnecessary type conversions
    - unparam      # reports unused function parameters
    - unused       # checks for unused code

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: indent-error-flow
        - name: time-naming
        - name: unexported-return
        - name: var-naming

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam  # test helpers often have fixed injectable signatures

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/robmyersrobmyers/oci-configs
